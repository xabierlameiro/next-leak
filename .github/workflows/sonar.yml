name: Sonar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sonar:
    runs-on: ubuntu-latest
    # Forks and Dependabot runs get no Actions secrets; skip instead of failing
    # their PRs. A human push to a Dependabot branch still runs the scan.
    if: github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --coverage.enabled --coverage.provider=v8
          --coverage.include='src/**/*.ts' --coverage.exclude='src/**/*.test.ts'
          --coverage.reporter=lcov
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
